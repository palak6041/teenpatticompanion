
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3 Patti Table Pro</title>
    <style>
        /* Modern UI/UX Variables */
        :root {
            --bg-base: #0f172a;
            --bg-surface: #1e293b;
            --bg-surface-elevated: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --blind: #8b5cf6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: #334155;
            --radius-md: 8px;
            --radius-lg: 12px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            overscroll-behavior-y: none;
            display: flex;
            flex-direction: column;
            height: 100vh; /* Fallback */
            height: 100dvh; /* Fixes mobile browser address bar overlap */
        }

        /* Reusable UI Components */
        .container { padding: 12px; max-width: 600px; margin: 0 auto; width: 100%; }
        h2, h3 { margin: 0 0 12px 0; text-align: center; }
        label { display: block; margin-bottom: 4px; color: var(--text-secondary); font-size: 12px; }

        input {
            width: 100%;
            background: var(--bg-base);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 10px 12px;
            border-radius: var(--radius-md);
            font-size: 16px !important; 
            outline: none;
            touch-action: manipulation; 
        }
        input:focus { border-color: var(--accent); }
        
        button {
            border: none;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 700;
            padding: 10px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            touch-action: manipulation; 
            transition: opacity 0.1s;
        }
        button:active { opacity: 0.8; transform: scale(0.98); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .btn-primary { background: var(--success); color: white; width: 100%; }
        .btn-danger { background: var(--danger); color: white; width: 100%; }
        .btn-action { background: var(--accent); color: white; }
        .btn-blind { background: var(--blind); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-primary); }
        
        /* Layout Sections */
        #setup-screen { padding: 12px; overflow-y: auto; height: 100%; }
        #summary-screen { display: none; padding: 12px; overflow-y: auto; height: 100%; }
        #game-screen { display: none; flex-direction: column; height: 100%; overflow: hidden; }
        
        /* --- COMPACT SETUP SCREEN UI --- */
        .setup-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .setup-card { background: var(--bg-surface); padding: 12px; border-radius: var(--radius-md); margin-bottom: 12px; }
        
        .compact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .compact-grid .full-width { grid-column: span 2; }
        .setup-input { padding: 8px 12px; height: 40px; font-size: 15px !important; }
        
        .seating-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
        .seating-row:last-child { margin-bottom: 0; }
        .seating-row input { flex: 1; padding: 8px 12px; height: 40px; font-size: 15px !important; }
        .btn-mini { width: 36px; min-width: 36px; height: 40px; padding: 0; background: var(--bg-surface-elevated); color: white; border-radius: 6px; }

        /* Game Header: Pot & Controls */
        .game-header {
            background: var(--bg-surface);
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .pot-display { display: flex; flex-direction: column; }
        .pot-label { color: var(--text-secondary); font-size: 11px; text-transform: uppercase; font-weight: bold; }
        .pot-value { font-size: 26px; font-weight: 900; color: var(--warning); line-height: 1; }
        .header-controls { display: flex; gap: 8px; }
        .btn-time { width: 40px; height: 40px; padding: 0; font-size: 20px; background: var(--bg-surface-elevated); color: white; }
        .btn-end { background: var(--danger); width: auto; padding: 0 12px; font-size: 14px; color: white; }

        /* Part 1: Split Screen - Table Overview Grid */
        .table-overview {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            align-content: start;
        }
        .mini-card {
            background: var(--bg-surface);
            border: 2px solid transparent;
            padding: 10px;
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            gap: 4px;
            cursor: pointer;
        }
        .mini-card.active { border-color: var(--accent); background: rgba(59, 130, 246, 0.1); }
        .mini-card.folded { opacity: 0.4; border-style: dashed; border-color: var(--border); }
        .mini-card.sitting-out { opacity: 0.3; background: #000; }
        
        .mc-header { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
        .mc-name { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .status-badge { font-size: 10px; background: var(--border); padding: 2px 6px; border-radius: 4px; white-space: nowrap; flex-shrink: 0; }
        
        .mc-bal { font-size: 16px; font-weight: bold; color: var(--success); }
        .mc-bal.negative { color: var(--danger); }

        /* Part 2: Split Screen - Focus Mode (Active Turn) */
        .focus-panel {
            background: var(--bg-surface);
            border-top: 1px solid var(--border);
            padding: 12px 16px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            flex-shrink: 0;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.2);
        }
        .focus-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .focus-name { font-size: 20px; font-weight: 800; }
        .focus-balance { font-size: 20px; font-weight: 700; color: var(--success); }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .bet-input-wrapper { grid-column: span 2; display: flex; gap: 8px; }
        .bet-input-wrapper input { text-align: center; font-weight: bold; font-size: 18px !important; height: 44px; }
        .bet-input-wrapper button { flex: 1; height: 44px; }
        
        .action-btn-large { height: 44px; }

        /* Settlement Screen */
        .settlement-card { background: var(--bg-surface); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 16px; }
        .settlement-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
        .settlement-item:last-child { border-bottom: none; }
        .debtor { color: var(--danger); font-weight: bold; }
        .creditor { color: var(--success); font-weight: bold; }
    </style>
</head>
<body>

<div id="setup-screen" class="container">
    <div class="setup-header">
        <h2 style="margin: 0; font-size: 20px;">Table Config</h2>
        <button class="btn-primary" style="width: auto; padding: 8px 16px; min-height: 40px;" onclick="startGame()">Start Game ▶</button>
    </div>
    
    <div class="setup-card">
        <div class="compact-grid">
            <div>
                <label>Start Coins</label>
                <input type="number" id="start-coins" value="1000" step="100" inputmode="numeric" class="setup-input">
            </div>
            <div>
                <label>Boot (Ante)</label>
                <input type="number" id="boot-amount" value="10" step="5" inputmode="numeric" class="setup-input">
            </div>
            <div class="full-width">
                <label>Max Pot Limit (0 = No Limit)</label>
                <input type="number" id="max-pot" value="6000" step="100" inputmode="numeric" class="setup-input">
            </div>
        </div>
    </div>

    <div class="setup-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <label style="margin: 0; color: var(--text-primary); font-weight: bold;">Player Seating (Turn Order)</label>
            <div style="display: flex; gap: 6px;">
                <button class="btn-mini" onclick="removeSetupPlayer()">-</button>
                <button class="btn-mini" onclick="addSetupPlayer()">+</button>
            </div>
        </div>
        <div id="seating-container">
            </div>
    </div>
</div>

<div id="game-screen">
    <div class="game-header">
        <div class="pot-display">
            <span class="pot-label">Total Pot</span>
            <span class="pot-value" id="pot-display">0</span>
        </div>
        <div class="header-controls">
            <button class="btn-time" id="btn-undo" onclick="undo()">↺</button>
            <button class="btn-time" id="btn-redo" onclick="redo()">↻</button>
            <button class="btn-time btn-end" onclick="endGame()">End</button>
        </div>
    </div>

    <div class="table-overview" id="overview-grid">
        </div>

    <div class="focus-panel" id="focus-panel">
        </div>
</div>

<div id="summary-screen" class="container">
    <h2>Settlement Summary</h2>
    <div class="settlement-card" id="settlement-list"></div>
    <button class="btn-danger" onclick="confirmReset()">Close & Clear Table Data</button>
</div>

<script>
    // --- STATE MANAGEMENT ---
    let state = {
        players: [],
        pot: 0,
        bootAmount: 10,
        startingCoins: 1000,
        maxPotLimit: 6000,
        currentIdx: 0
    };
    
    let setupPlayerCount = 6;
    let historyStack = [];
    let redoStack = [];

    // --- DOM ELEMENTS ---
    const screens = {
        setup: document.getElementById('setup-screen'),
        game: document.getElementById('game-screen'),
        summary: document.getElementById('summary-screen')
    };

    // --- SETUP LOGIC ---
    window.onload = () => {
        renderSetupSeating();
        loadFromStorage();
    };

    function renderSetupSeating() {
        const container = document.getElementById('seating-container');
        container.innerHTML = '';
        for(let i=0; i<setupPlayerCount; i++) {
            container.innerHTML += `
                <div class="seating-row">
                    <input type="text" id="seat-name-${i}" placeholder="Seat ${i+1}" value="Player ${i+1}">
                    <button class="btn-mini" onclick="moveSeatUp(${i})">↑</button>
                    <button class="btn-mini" onclick="moveSeatDown(${i})">↓</button>
                </div>
            `;
        }
    }

    function addSetupPlayer() { setupPlayerCount++; renderSetupSeating(); }
    function removeSetupPlayer() { if(setupPlayerCount > 2) { setupPlayerCount--; renderSetupSeating(); } }

    function moveSeatUp(index) {
        if(index === 0) return;
        swapSeatValues(index, index - 1);
    }
    
    function moveSeatDown(index) {
        if(index === setupPlayerCount - 1) return;
        swapSeatValues(index, index + 1);
    }

    function swapSeatValues(idx1, idx2) {
        const val1 = document.getElementById(`seat-name-${idx1}`).value;
        const val2 = document.getElementById(`seat-name-${idx2}`).value;
        document.getElementById(`seat-name-${idx1}`).value = val2;
        document.getElementById(`seat-name-${idx2}`).value = val1;
    }

    // --- STORAGE & MIGRATION ---
    function loadFromStorage() {
        const saved = localStorage.getItem('3patti_pro');
        if (saved) {
            const data = JSON.parse(saved);
            state.players = data.players || [];
            state.pot = data.pot || 0;
            state.bootAmount = data.bootAmount || 10;
            state.startingCoins = data.startingCoins || 1000;
            state.maxPotLimit = data.maxPotLimit || (state.players.length * state.startingCoins);
            state.currentIdx = data.currentIdx || 0;

            state.players.forEach(p => { p.isSittingOut = p.isSittingOut || false; });

            switchScreen('game');
            renderGameUI();
        }
    }

    function saveToStorage() {
        localStorage.setItem('3patti_pro', JSON.stringify(state));
    }

    // --- TIME TRAVEL (UNDO/REDO) ---
    function captureSnapshot() {
        historyStack.push(JSON.stringify(state));
        redoStack = []; 
        updateTimeButtons();
    }

    function undo() {
        if (historyStack.length === 0) return;
        redoStack.push(JSON.stringify(state));
        state = JSON.parse(historyStack.pop());
        saveToStorage();
        renderGameUI();
    }

    function redo() {
        if (redoStack.length === 0) return;
        historyStack.push(JSON.stringify(state));
        state = JSON.parse(redoStack.pop());
        saveToStorage();
        renderGameUI();
    }

    function updateTimeButtons() {
        document.getElementById('btn-undo').disabled = historyStack.length === 0;
        document.getElementById('btn-redo').disabled = redoStack.length === 0;
    }

    // --- GAME ENGINE ---
    function switchScreen(target) {
        Object.values(screens).forEach(s => s.style.display = 'none');
        screens[target].style.display = target === 'game' ? 'flex' : 'block';
    }

    function startGame() {
        state.startingCoins = parseInt(document.getElementById('start-coins').value);
        state.bootAmount = parseInt(document.getElementById('boot-amount').value);
        state.maxPotLimit = parseInt(document.getElementById('max-pot').value) || Infinity;
        
        state.players = [];
        for(let i=0; i<setupPlayerCount; i++) {
            const nameInput = document.getElementById(`seat-name-${i}`);
            const pName = nameInput && nameInput.value.trim() !== '' ? nameInput.value.trim() : `Player ${i+1}`;
            
            state.players.push({
                id: i+1,
                name: pName,
                balance: state.startingCoins,
                startingBalance: state.startingCoins,
                isFolded: false,
                isSittingOut: false
            });
        }
        
        state.pot = 0;
        state.currentIdx = 0;
        historyStack = [];
        redoStack = [];
        
        saveToStorage();
        switchScreen('game');
        renderGameUI();
    }

    function toggleSitOut(idx) {
        captureSnapshot();
        state.players[idx].isSittingOut = !state.players[idx].isSittingOut;
        if(state.players[idx].isSittingOut) state.players[idx].isFolded = true;
        saveToStorage();
        renderGameUI();
    }

    function collectBoot() {
        captureSnapshot();
        let activeCount = 0;
        
        state.players.forEach(p => {
            if (!p.isSittingOut) {
                p.isFolded = false; 
                p.balance -= state.bootAmount;
                activeCount++;
            }
        });
        
        state.pot += (activeCount * state.bootAmount);
        
        state.currentIdx = -1;
        advanceTurn(); 
        
        saveToStorage();
        renderGameUI();
    }

    function executeBet(playerId, multiplier = 1) {
        const input = document.getElementById(`bet-input-${playerId}`);
        const baseAmount = parseInt(input.value);
        if (isNaN(baseAmount) || baseAmount <= 0) return alert("Invalid amount");

        const finalAmount = baseAmount * multiplier;

        if (state.pot + finalAmount > state.maxPotLimit) {
            return alert(`Bet rejected. Max pot limit is ${state.maxPotLimit.toLocaleString()}. Must show cards!`);
        }

        captureSnapshot();
        const p = state.players.find(p => p.id === playerId);
        p.balance -= finalAmount;
        state.pot += finalAmount;
        
        advanceTurn();
        saveToStorage();
        renderGameUI();
    }

    function foldPlayer(playerId) {
        captureSnapshot();
        const p = state.players.find(p => p.id === playerId);
        p.isFolded = true;
        advanceTurn();
        saveToStorage();
        renderGameUI();
    }

    function awardPot(playerId) {
        if (state.pot === 0) return alert("Pot is empty.");
        const p = state.players.find(p => p.id === playerId);
        if (!confirm(`Award ${state.pot.toLocaleString()} to ${p.name}?`)) return;

        captureSnapshot();
        p.balance += state.pot;
        state.pot = 0; 
        state.players.forEach(pl => { if(!pl.isSittingOut) pl.isFolded = false; });
        saveToStorage();
        renderGameUI();
    }

    function advanceTurn() {
        let attempts = 0;
        do {
            state.currentIdx = (state.currentIdx + 1) % state.players.length;
            attempts++;
            if (attempts > state.players.length) break; 
        } while (state.players[state.currentIdx].isFolded || state.players[state.currentIdx].isSittingOut);
    }

    // --- RENDERING ---
    function renderGameUI() {
        document.getElementById('pot-display').innerText = state.pot.toLocaleString();
        updateTimeButtons();

        const grid = document.getElementById('overview-grid');
        const focus = document.getElementById('focus-panel');
        
        // Render Top Grid
        grid.innerHTML = '';
        state.players.forEach((p, index) => {
            let status = '';
            let classes = ['mini-card'];
            if (index === state.currentIdx) classes.push('active');
            if (p.isSittingOut) { classes.push('sitting-out'); status = 'Sitting Out'; }
            else if (p.isFolded) { classes.push('folded'); status = 'Packed'; }

            const balClass = p.balance < 0 ? 'negative' : '';
            const badgeHTML = status ? `<div class="status-badge">${status}</div>` : '';

            grid.innerHTML += `
                <div class="${classes.join(' ')}" onclick="state.currentIdx = ${index}; renderGameUI();">
                    <div class="mc-header">
                        <div class="mc-name">${p.name}</div>
                        ${badgeHTML}
                    </div>
                    <div class="mc-bal ${balClass}">${p.balance.toLocaleString()}</div>
                </div>
            `;
        });

        // Render Focus Panel
        const cp = state.players[state.currentIdx];
        if (!cp) return;

        const isLocked = cp.isFolded || cp.isSittingOut;
        const balClass = cp.balance < 0 ? 'negative' : '';
        const sitOutText = cp.isSittingOut ? 'Join Next Hand' : 'Sit Out Hand';
        const limitWarning = (state.pot >= state.maxPotLimit) ? `<div style="color:var(--danger); font-size:12px; font-weight:bold; text-align:center; margin-bottom:8px;">POT LIMIT REACHED</div>` : '';

        let focusBody = '';

        if (state.pot === 0) {
            focusBody = `
                <div style="text-align:center; padding: 12px 10px; color: var(--text-secondary); background: var(--bg-base); border-radius: var(--radius-md); margin-bottom: 12px; font-size: 14px;">
                    Hand has not started.<br>Collect boot to deal cards.
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
                    <button class="btn-primary action-btn-large" onclick="collectBoot()">Deal / Boot</button>
                    <button class="btn-outline action-btn-large" onclick="toggleSitOut(${state.currentIdx})">${sitOutText}</button>
                </div>
            `;
        } else {
            focusBody = `
                ${limitWarning}
                ${!isLocked ? `
                    <div class="action-grid" style="margin-bottom: 10px;">
                        <div class="bet-input-wrapper">
                            <input type="number" id="bet-input-${cp.id}" value="${state.bootAmount}" step="${state.bootAmount}" inputmode="numeric">
                        </div>
                        <button class="btn-action action-btn-large" onclick="executeBet(${cp.id}, 1)">Bet</button>
                        <button class="btn-blind action-btn-large" onclick="executeBet(${cp.id}, 2)">Bet x2</button>
                        
                        <button class="btn-outline action-btn-large" style="grid-column: span 2" onclick="foldPlayer(${cp.id})">Pack (Fold)</button>
                    </div>
                ` : `<div style="text-align:center; padding: 12px; color: var(--text-secondary); background: var(--bg-base); border-radius: var(--radius-md); margin-bottom: 12px; font-size: 14px;">Player is currently ${cp.isSittingOut ? 'Sitting Out' : 'Packed'}</div>`}

                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
                    <button class="btn-primary action-btn-large" style="background:var(--warning); color:#000;" onclick="awardPot(${cp.id})">🏆 Take Pot</button>
                    <button class="btn-outline action-btn-large" onclick="toggleSitOut(${state.currentIdx})">${sitOutText}</button>
                </div>
            `;
        }

        focus.innerHTML = `
            <div class="focus-header">
                <div class="focus-name">${cp.name}</div>
                <div class="focus-balance ${balClass}">${cp.balance.toLocaleString()} 🪙</div>
            </div>
            ${focusBody}
        `;
    }

    // --- END GAME & SETTLEMENT ---
    function endGame() {
        if (state.pot > 0) return alert(`There are ${state.pot} coins in the pot. Award them first!`);
        if (confirm("End the game and calculate settlements?")) {
            calculateSettlements();
            switchScreen('summary');
        }
    }

    function calculateSettlements() {
        let debtors = [], creditors = [];
        state.players.forEach(p => {
            const net = p.balance - p.startingBalance;
            if (net < 0) debtors.push({ name: p.name, amount: Math.abs(net) });
            else if (net > 0) creditors.push({ name: p.name, amount: net });
        });

        debtors.sort((a, b) => b.amount - a.amount);
        creditors.sort((a, b) => b.amount - a.amount);

        let html = '', i = 0, j = 0;
        while (i < debtors.length && j < creditors.length) {
            let d = debtors[i], c = creditors[j];
            let amt = Math.min(d.amount, c.amount);
            
            html += `
                <div class="settlement-item">
                    <span><span class="debtor">${d.name}</span> pays <span class="creditor">${c.name}</span></span>
                    <span style="color:var(--warning); font-weight:bold;">${amt} 🪙</span>
                </div>
            `;
            d.amount -= amt; c.amount -= amt;
            if (d.amount === 0) i++;
            if (c.amount === 0) j++;
        }
        
        document.getElementById('settlement-list').innerHTML = html || '<div style="text-align:center;">Everyone broke even!</div>';
    }

    function confirmReset() {
        localStorage.removeItem('3patti_pro');
        location.reload(); 
    }
</script>

</body>
</html>
