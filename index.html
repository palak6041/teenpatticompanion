
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3 Patti Table</title>
    <style>
        :root {
            --bg-base: #0f172a;
            --bg-surface: #1e293b;
            --bg-surface-elevated: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: #334155;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            overscroll-behavior-y: none;
        }

        .container { padding: 16px; max-width: 600px; margin: 0 auto; }
        h2 { margin: 0 0 16px 0; font-size: 24px; text-align: center; }
        label { display: block; margin-bottom: 6px; color: var(--text-secondary); font-size: 14px; }

        /* Mobile-optimized inputs: 16px font-size prevents iOS auto-zoom */
        input {
            width: 100%;
            background: var(--bg-base);
            border: 2px solid var(--border);
            color: var(--text-primary);
            padding: 14px;
            border-radius: var(--radius-md);
            font-size: 16px !important; 
            outline: none;
            transition: border-color 0.2s;
            touch-action: manipulation; /* Prevents double-tap zoom */
        }
        input:focus { border-color: var(--accent); }
        
        button {
            border: none;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 700;
            padding: 16px 12px;
            cursor: pointer;
            width: 100%;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            touch-action: manipulation; /* Prevents double-tap zoom */
        }
        button:active { filter: brightness(0.9); transform: scale(0.98); }
        
        .btn-primary { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-action { background: var(--accent); color: white; }
        .btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text-primary); }
        .btn-win { background: var(--warning); color: #000; margin-top: 10px; }

        /* Screens */
        #setup-screen, #summary-screen { padding-bottom: 40px; }
        #game-screen { display: none; padding-bottom: 80px; }
        #summary-screen { display: none; }

        .setup-group { margin-bottom: 20px; background: var(--bg-surface); padding: 20px; border-radius: var(--radius-lg); }
        #names-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }

        /* Sticky Header */
        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(8px);
            padding: 16px;
            border-bottom: 1px solid var(--border);
            margin: 0 -16px 20px -16px;
        }

        .pot-display { text-align: center; margin-bottom: 12px; }
        .pot-label { color: var(--text-secondary); font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .pot-value { font-size: 42px; font-weight: 800; color: var(--warning); line-height: 1.1; }

        .header-actions { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
        .btn-reset-game { padding: 12px; font-size: 14px; min-height: 44px; }
        .btn-boot { padding: 12px; min-height: 44px; }

        /* Player Cards */
        .player-list { display: flex; flex-direction: column; gap: 16px; }

        .player-card {
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            padding: 16px;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .player-card.folded {
            opacity: 0.4;
            background: var(--bg-base);
            border-color: var(--border);
            border-style: dashed;
        }
        
        .player-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .player-name { font-size: 18px; font-weight: 700; }
        .player-name .folded-badge { font-size: 12px; background: var(--border); padding: 4px 8px; border-radius: 4px; margin-left: 8px; }
        .player-balance { font-size: 20px; font-weight: 700; color: var(--success); }
        .player-balance.negative { color: var(--danger); }

        .player-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .bet-group { display: flex; gap: 8px; grid-column: span 2; }
        .bet-group input { width: 40%; text-align: center; font-weight: bold; background: var(--bg-base); }
        .bet-group button { width: 60%; }

        /* Summary List */
        .settlement-card {
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 20px;
        }
        .settlement-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            font-size: 16px;
        }
        .settlement-item:last-child { border-bottom: none; }
        .pay-amount { font-weight: bold; color: var(--warning); }
        .debtor { color: var(--danger); font-weight: bold; }
        .creditor { color: var(--success); font-weight: bold; }

    </style>
</head>
<body>

<div class="container">
    
    <div id="setup-screen">
        <h2>Table Setup</h2>
        
        <div class="setup-group">
            <label>Players Count</label>
            <input type="number" id="player-count" min="2" max="15" value="6" inputmode="numeric" pattern="[0-9]*">
            <div id="names-container"></div>
        </div>

        <div class="setup-group">
            <label>Starting Coins</label>
            <input type="number" id="start-coins" value="1000" step="100" inputmode="numeric" pattern="[0-9]*">
            
            <label style="margin-top: 16px;">Boot (Ante)</label>
            <input type="number" id="boot-amount" value="10" step="5" inputmode="numeric" pattern="[0-9]*">
        </div>

        <button class="btn-primary" onclick="startGame()">Start Game</button>
    </div>

    <div id="game-screen">
        <div class="sticky-header">
            <div class="pot-display">
                <div class="pot-label">Total Pot</div>
                <div class="pot-value" id="pot-display">0</div>
            </div>
            
            <div class="header-actions">
                <button class="btn-primary btn-boot" onclick="collectBoot()">Deal / Collect Boot</button>
                <button class="btn-danger btn-reset-game" onclick="endGame()">End Game</button>
            </div>
        </div>

        <div class="player-list" id="player-grid"></div>
    </div>

    <div id="summary-screen">
        <h2>Game Settlement</h2>
        <p style="text-align: center; color: var(--text-secondary); margin-bottom: 20px;">Who owes who to settle up:</p>
        
        <div class="settlement-card" id="settlement-list">
            </div>

        <button class="btn-danger" onclick="confirmReset()">Close & Reset Table</button>
    </div>

</div>

<script>
    let players = [];
    let pot = 0;
    let bootAmount = 10;

    const setupScreen = document.getElementById('setup-screen');
    const gameScreen = document.getElementById('game-screen');
    const summaryScreen = document.getElementById('summary-screen');
    const playerGrid = document.getElementById('player-grid');
    const potDisplay = document.getElementById('pot-display');
    const playerCountInput = document.getElementById('player-count');
    const namesContainer = document.getElementById('names-container');
    const settlementList = document.getElementById('settlement-list');

    function generateNameInputs() {
        const count = parseInt(playerCountInput.value);
        namesContainer.innerHTML = '';
        if (count < 2 || count > 15 || isNaN(count)) return;

        for (let i = 1; i <= count; i++) {
            namesContainer.innerHTML += `
                <input type="text" id="name-input-${i}" placeholder="P${i} Name" value="Player ${i}">
            `;
        }
    }

    playerCountInput.addEventListener('input', generateNameInputs);

    window.onload = function() {
        generateNameInputs();
        const savedData = localStorage.getItem('3patti_mobile');
        if (savedData) {
            const data = JSON.parse(savedData);
            players = data.players;
            pot = data.pot;
            bootAmount = data.bootAmount;
            
            setupScreen.style.display = 'none';
            gameScreen.style.display = 'block';
            renderUI();
        }
    };

    function saveData() {
        localStorage.setItem('3patti_mobile', JSON.stringify({ players, pot, bootAmount }));
    }

    function startGame() {
        const count = parseInt(playerCountInput.value);
        const startingCoins = parseInt(document.getElementById('start-coins').value);
        bootAmount = parseInt(document.getElementById('boot-amount').value);

        if (count < 2 || isNaN(count)) return alert("Need at least 2 players");

        players = [];
        for (let i = 1; i <= count; i++) {
            const nameInput = document.getElementById(`name-input-${i}`);
            const playerName = nameInput && nameInput.value.trim() !== '' ? nameInput.value.trim() : `Player ${i}`;
            
            players.push({ 
                id: i, 
                name: playerName, 
                balance: startingCoins, 
                startingBalance: startingCoins, // Store for final calculation
                isFolded: false 
            });
        }

        pot = 0;
        saveData();
        setupScreen.style.display = 'none';
        gameScreen.style.display = 'block';
        window.scrollTo(0, 0);
        renderUI();
    }

    function endGame() {
        if (pot > 0) {
            alert(`There are still ${pot} coins in the pot! Please award the pot to the winner before ending the game.`);
            return;
        }

        if (confirm("Generate final settlements and close the table?")) {
            calculateSettlements();
            gameScreen.style.display = 'none';
            summaryScreen.style.display = 'block';
            window.scrollTo(0, 0);
        }
    }

    function calculateSettlements() {
        let debtors = [];
        let creditors = [];

        // Identify winners and losers
        players.forEach(p => {
            const startBal = p.startingBalance || 1000; // fallback if loaded from older version
            const net = p.balance - startBal;
            
            if (net < 0) debtors.push({ name: p.name, amount: Math.abs(net) });
            else if (net > 0) creditors.push({ name: p.name, amount: net });
        });

        // Sort descending to optimize transfers (largest debts pay largest wins first)
        debtors.sort((a, b) => b.amount - a.amount);
        creditors.sort((a, b) => b.amount - a.amount);

        let html = '';
        let i = 0;
        let j = 0;

        // Greedy matching algorithm
        while (i < debtors.length && j < creditors.length) {
            let debtor = debtors[i];
            let creditor = creditors[j];
            
            let settleAmount = Math.min(debtor.amount, creditor.amount);
            
            html += `
                <div class="settlement-item">
                    <span><span class="debtor">${debtor.name}</span> pays <span class="creditor">${creditor.name}</span></span>
                    <span class="pay-amount">${settleAmount} 🪙</span>
                </div>
            `;

            debtor.amount -= settleAmount;
            creditor.amount -= settleAmount;

            if (debtor.amount === 0) i++;
            if (creditor.amount === 0) j++;
        }

        if (html === '') {
            html = '<div style="text-align:center; padding: 20px;">Everyone broke even!</div>';
        }

        settlementList.innerHTML = html;
    }

    function confirmReset() {
        localStorage.removeItem('3patti_mobile');
        players = [];
        pot = 0;
        summaryScreen.style.display = 'none';
        setupScreen.style.display = 'block';
        generateNameInputs();
        window.scrollTo(0, 0);
    }

    function collectBoot() {
        players.forEach(p => p.isFolded = false);
        let activePlayersCount = 0;
        players.forEach(p => {
            p.balance -= bootAmount;
            activePlayersCount++;
        });
        pot += (activePlayersCount * bootAmount);
        saveData();
        renderUI();
    }

    function placeBet(playerId) {
        const player = players.find(p => p.id === playerId);
        const input = document.getElementById(`bet-input-${playerId}`);
        const amount = parseInt(input.value);

        if (isNaN(amount) || amount <= 0) return alert("Enter a valid bet");

        player.balance -= amount;
        pot += amount;
        saveData();
        renderUI();
    }

    function foldPlayer(playerId) {
        const player = players.find(p => p.id === playerId);
        player.isFolded = true;
        saveData();
        renderUI();
    }

    function awardWinner(playerId) {
        if (pot === 0) return alert("The pot is empty!");
        const player = players.find(p => p.id === playerId);
        if (!confirm(`Give ${pot} to ${player.name}?`)) return;

        player.balance += pot;
        pot = 0;
        players.forEach(p => p.isFolded = false);
        saveData();
        renderUI();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderUI() {
        potDisplay.innerText = pot.toLocaleString();
        playerGrid.innerHTML = '';

        players.forEach(p => {
            const isBankrupt = p.balance < 0 ? 'negative' : '';
            const foldedClass = p.isFolded ? 'folded' : '';
            const badge = p.isFolded ? `<span class="folded-badge">Packed</span>` : '';
            
            const cardHTML = `
                <div class="player-card ${foldedClass}">
                    <div class="player-info">
                        <div class="player-name">${p.name} ${badge}</div>
                        <div class="player-balance ${isBankrupt}">${p.balance.toLocaleString()}</div>
                    </div>
                    
                    ${!p.isFolded ? `
                        <div class="player-actions">
                            <div class="bet-group">
                                <input type="number" id="bet-input-${p.id}" value="${bootAmount}" step="${bootAmount}" inputmode="numeric" pattern="[0-9]*">
                                <button class="btn-action" onclick="placeBet(${p.id})">Bet</button>
                            </div>
                            <button class="btn-outline" onclick="foldPlayer(${p.id})">Pack (Fold)</button>
                        </div>
                    ` : ''}
                    
                    ${pot > 0 ? `
                        <button class="btn-win" onclick="awardWinner(${p.id})">🏆 Take Pot</button>
                    ` : ''}
                </div>
            `;
            playerGrid.innerHTML += cardHTML;
        });
    }
</script>

</body>
</html>
