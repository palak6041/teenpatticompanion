
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3 Patti Table Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0f172a;
            --bg-surface: #1e293b;
            --bg-surface-elevated: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --blind: #8b5cf6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: #334155;
            --radius-md: 8px;
            --radius-lg: 12px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-base);
            background-image: radial-gradient(circle at top center, #1e293b 0%, #0f172a 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            overscroll-behavior-y: none;
            display: flex;
            flex-direction: column;
            height: 100vh; 
            height: 100dvh; 
        }

        /* Safe Area Padding Fix for iPhone Notch / Top Bar */
        .safe-padding-top {
            padding-top: max(12px, env(safe-area-inset-top));
        }

        .container { 
            padding: 12px; 
            padding-top: max(12px, env(safe-area-inset-top));
            max-width: 600px; 
            margin: 0 auto; 
            width: 100%; 
            display: flex;
            flex-direction: column;
        }
        
        h2, h3 { margin: 0 0 12px 0; text-align: center; letter-spacing: -0.02em; }
        label { display: block; margin-bottom: 4px; color: var(--text-secondary); font-size: 12px; font-weight: 600; }

        input, select {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 10px 12px;
            border-radius: var(--radius-md);
            font-size: 16px !important; 
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus, select:focus { 
            border-color: var(--accent); 
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); 
        }
        
        button {
            border: none;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 700;
            padding: 10px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.1s, filter 0.2s, box-shadow 0.2s;
        }
        button:active { transform: scale(0.97); filter: brightness(0.9); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; filter: none; }
        
        .btn-primary { background: linear-gradient(135deg, #10b981, #059669); color: white; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }
        .btn-action { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2); }
        .btn-blind { background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: white; box-shadow: inset 0 2px 4px rgba(255,255,255,0.1), 0 4px 12px rgba(139, 92, 246, 0.2); border: 1px solid rgba(255,255,255,0.1); }
        .btn-outline { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-primary); }
        
        .svg-icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        
        /* Layout Sections */
        #setup-screen { overflow-y: auto; height: 100%; }
        #summary-screen { display: none; overflow-y: auto; height: 100%; }
        #game-screen { display: none; flex-direction: column; height: 100%; overflow: hidden; }
        
        .setup-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .setup-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 16px; border-radius: var(--radius-md); margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.05); }
        
        .compact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .compact-grid .full-width { grid-column: span 2; }
        .setup-input { padding: 8px 12px; height: 42px; font-size: 15px !important; }
        
        .seating-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
        .seating-row:last-child { margin-bottom: 0; }
        .seating-row input { flex: 1; padding: 8px 12px; height: 42px; font-size: 15px !important; }
        .btn-mini { width: 38px; min-width: 38px; height: 42px; padding: 0; background: var(--bg-surface-elevated); color: white; border-radius: 6px; }

        /* Game Header */
        .game-header {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            z-index: 10;
        }
        .pot-display { display: flex; flex-direction: column; }
        .pot-label { color: var(--text-secondary); font-size: 11px; text-transform: uppercase; font-weight: 800; letter-spacing: 0.05em; }
        .pot-value { font-size: 28px; font-weight: 900; color: var(--warning); line-height: 1.1; text-shadow: 0 2px 10px rgba(245, 158, 11, 0.3); }
        .header-controls { display: flex; gap: 8px; }
        .btn-time { width: 42px; height: 42px; padding: 0; background: var(--bg-surface-elevated); color: white; }
        .btn-end { background: linear-gradient(135deg, var(--danger), #b91c1c); width: auto; padding: 0 14px; font-size: 14px; color: white; }

        .game-content { display: flex; flex-direction: column; flex: 1; overflow: hidden; }

        /* Table Overview Grid */
        .table-overview {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            align-content: start;
        }
        
        .mini-card {
            background: rgba(30, 41, 59, 0.6);
            border: 2px solid transparent;
            padding: 12px;
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .mini-card.active { 
            border-color: var(--accent); 
            background: rgba(59, 130, 246, 0.15); 
            animation: pulseGlow 2s infinite;
        }
        
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 8px rgba(59, 130, 246, 0.2); }
            50% { box-shadow: 0 0 16px rgba(59, 130, 246, 0.5); }
            100% { box-shadow: 0 0 8px rgba(59, 130, 246, 0.2); }
        }

        .mini-card.folded { opacity: 0.4; border-style: dashed; border-color: var(--border); filter: grayscale(50%); }
        .mini-card.sitting-out { opacity: 0.2; background: #000; }
        .mini-card.negative-bg { background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.3); }
        
        .mc-header { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
        .mc-name { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.01em; }
        .status-badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; background: var(--border); padding: 2px 6px; border-radius: 4px; white-space: nowrap; flex-shrink: 0; }
        
        .mc-bal { font-size: 17px; font-weight: 800; color: var(--success); }
        .mc-bal.negative { color: var(--danger); }

        /* Focus Panel */
        .focus-panel {
            background: var(--bg-surface);
            border-top: 1px solid rgba(255,255,255,0.05);
            padding: 16px 20px;
            padding-bottom: max(16px, env(safe-area-inset-bottom));
            flex-shrink: 0;
            box-shadow: 0 -8px 24px rgba(0,0,0,0.4);
            overflow-y: auto;
        }
        .focus-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .focus-name { font-size: 22px; font-weight: 900; letter-spacing: -0.02em; }
        .focus-balance { font-size: 22px; font-weight: 800; color: var(--success); }

        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        /* Stepper Controls */
        .bet-stepper {
            grid-column: span 2;
            display: flex;
            align-items: center;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            height: 48px;
            overflow: hidden;
        }
        .bet-stepper button {
            flex: 0 0 56px;
            height: 100%;
            background: var(--bg-surface-elevated);
            border-radius: 0;
            font-size: 22px;
            color: var(--text-primary);
        }
        .bet-stepper .bet-label {
            flex: 1;
            text-align: center;
            font-size: 18px;
            font-weight: 800;
        }
        .action-btn-large { height: 48px; font-size: 16px; }

        /* Custom Dialog UI */
        .modal-overlay { 
            display: none; position: fixed; inset: 0; 
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); 
            z-index: 999; align-items: center; justify-content: center; padding: 20px; 
            opacity: 0; transition: opacity 0.2s ease;
        }
        .modal-overlay.show { opacity: 1; }
        .modal-box { 
            background: var(--bg-surface); padding: 24px; border-radius: var(--radius-lg); 
            width: 100%; max-width: 380px; border: 1px solid rgba(255,255,255,0.1); 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            transform: scale(0.95); transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; align-items: center; text-align: center;
        }
        .modal-overlay.show .modal-box { transform: scale(1); }
        .modal-icon { width: 56px; height: 56px; margin-bottom: 16px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        .modal-icon.warning { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .modal-icon.question { background: rgba(59, 130, 246, 0.15); color: var(--accent); }
        .modal-title { font-size: 20px; font-weight: 800; margin: 0 0 8px 0; }
        .modal-text { font-size: 15px; color: var(--text-secondary); margin: 0 0 24px 0; line-height: 1.4; }
        .modal-buttons { display: flex; gap: 12px; width: 100%; }

        /* Generic Transfer Modal adjustments */
        #transfer-modal .modal-box { align-items: stretch; text-align: left; }

        /* Settlement Screen */
        .settlement-card { background: rgba(30, 41, 59, 0.7); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); }
        .settlement-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .settlement-item:last-child { border-bottom: none; }
        .debtor { color: var(--danger); font-weight: 700; }
        .creditor { color: var(--success); font-weight: 700; }

        /* --- LANDSCAPE SUPPORT --- */
        @media (orientation: landscape) {
            .game-content { flex-direction: row; }
            .table-overview { flex: 1; border-right: 1px solid var(--border); border-top: none; }
            .focus-panel { flex: 1; border-top: none; box-shadow: -8px 0 24px rgba(0,0,0,0.3); }
            .pot-value { font-size: 24px; }
            .btn-time { width: 38px; height: 38px; font-size: 16px; }
            .action-btn-large, .bet-stepper { height: 42px; }
        }
    </style>
</head>
<body>

<div id="setup-screen" class="container">
    <div class="setup-header">
        <h2 style="margin: 0; font-size: 22px; font-weight: 900;">Table Config</h2>
        <button class="btn-primary" style="width: auto; padding: 8px 16px; min-height: 42px;" onclick="startGame()">
            Start Game
            <svg class="svg-icon" viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor;"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </button>
    </div>
    
    <div class="setup-card">
        <div class="compact-grid">
            <div>
                <label>Start Coins</label>
                <input type="number" id="start-coins" value="1000" step="100" inputmode="numeric" class="setup-input">
            </div>
            <div>
                <label>Boot (Ante)</label>
                <input type="number" id="boot-amount" value="10" step="5" inputmode="numeric" class="setup-input">
            </div>
            <div class="full-width">
                <label>Max Pot Limit (0 = No Limit)</label>
                <input type="number" id="max-pot" value="6000" step="100" inputmode="numeric" class="setup-input">
            </div>
        </div>
    </div>

    <div class="setup-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <label style="margin: 0; color: var(--text-primary); font-weight: 700;">Player Seating (Turn Order)</label>
            <div style="display: flex; gap: 6px;">
                <button class="btn-mini" onclick="removeSetupPlayer()">-</button>
                <button class="btn-mini" onclick="addSetupPlayer()">+</button>
            </div>
        </div>
        <div id="seating-container">
            </div>
    </div>
</div>

<div id="game-screen">
    <div class="game-header safe-padding-top">
        <div class="pot-display">
            <span class="pot-label">Total Pot</span>
            <span class="pot-value" id="pot-display" data-value="0">0</span>
        </div>
        <div class="header-controls">
            <button class="btn-time" id="btn-undo" onclick="undo()">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            </button>
            <button class="btn-time" id="btn-redo" onclick="redo()">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
            </button>
            <button class="btn-time btn-end" onclick="endGame()">
                End 
                <svg class="svg-icon" viewBox="0 0 24 24" style="width:14px;height:14px;margin-left:-2px;"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
        </div>
    </div>

    <div class="game-content">
        <div class="table-overview" id="overview-grid">
            </div>

        <div class="focus-panel" id="focus-panel">
            </div>
    </div>
</div>

<div id="summary-screen" class="container">
    <h2 style="font-weight: 900; margin-bottom: 20px;">Settlement Summary</h2>
    <div class="settlement-card" id="settlement-list"></div>
    <button class="btn-danger action-btn-large" onclick="confirmReset()">Close & Reset Table</button>
</div>

<div id="transfer-modal" class="modal-overlay">
    <div class="modal-box">
        <h3 style="margin-top:0; font-weight: 800;">Transfer Coins</h3>
        <label>Transfer From:</label>
        <input type="text" id="transfer-from" disabled style="margin-bottom:12px; opacity:0.7;">
        
        <label>Transfer To:</label>
        <select id="transfer-to" style="margin-bottom:12px;"></select>
        
        <label>Amount:</label>
        <input type="number" id="transfer-amount" inputmode="numeric" style="margin-bottom:12px;">
        
        <label>Transfer Type:</label>
        <select id="transfer-type" style="margin-bottom:24px;">
            <option value="loan">Loan (Must be repaid at end)</option>
            <option value="gift">Gift (No repayment needed)</option>
        </select>
        
        <div class="modal-buttons">
            <button class="btn-outline action-btn-large" onclick="closeTransferModal()" style="flex:1;">Cancel</button>
            <button class="btn-primary action-btn-large" onclick="executeTransfer()" style="flex:1;">Confirm</button>
        </div>
    </div>
</div>

<div id="custom-dialog" class="modal-overlay">
    <div class="modal-box">
        <div id="dialog-icon" class="modal-icon"></div>
        <div id="dialog-title" class="modal-title">Title</div>
        <div id="dialog-text" class="modal-text">Message</div>
        <div class="modal-buttons">
            <button id="dialog-cancel" class="btn-outline action-btn-large" style="flex:1;">Cancel</button>
            <button id="dialog-confirm" class="btn-primary action-btn-large" style="flex:1;">Confirm</button>
        </div>
    </div>
</div>

<script>
    // --- CUSTOM DIALOG ENGINE ---
    const Dialog = {
        element: document.getElementById('custom-dialog'),
        iconEl: document.getElementById('dialog-icon'),
        titleEl: document.getElementById('dialog-title'),
        textEl: document.getElementById('dialog-text'),
        btnConfirm: document.getElementById('dialog-confirm'),
        btnCancel: document.getElementById('dialog-cancel'),

        icons: {
            warning: `<svg class="svg-icon" style="width:28px;height:28px;" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
            question: `<svg class="svg-icon" style="width:28px;height:28px;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`
        },

        show: function(type, title, text, confirmText, showCancel, onConfirm) {
            this.iconEl.className = `modal-icon ${type}`;
            this.iconEl.innerHTML = this.icons[type] || '';
            this.titleEl.innerText = title;
            this.textEl.innerText = text;
            
            this.btnConfirm.innerText = confirmText;
            this.btnConfirm.onclick = () => {
                this.hide();
                if(onConfirm) onConfirm();
            };

            if(showCancel) {
                this.btnCancel.style.display = 'flex';
                this.btnCancel.onclick = () => this.hide();
            } else {
                this.btnCancel.style.display = 'none';
            }

            this.element.style.display = 'flex';
            // slight delay to allow display:flex to apply before opacity transition
            setTimeout(() => this.element.classList.add('show'), 10); 
        },
        
        hide: function() {
            this.element.classList.remove('show');
            setTimeout(() => this.element.style.display = 'none', 200);
        },

        alert: function(title, text) {
            this.show('warning', title, text, 'Got it', false, null);
        },

        confirm: function(title, text, confirmText, onConfirm) {
            this.show('question', title, text, confirmText, true, onConfirm);
        }
    };

    // --- STATE MANAGEMENT ---
    let state = {
        players: [],
        pot: 0,
        bootAmount: 10,
        currentBet: 10, 
        startingCoins: 1000,
        maxPotLimit: 6000,
        currentIdx: 0,
        gameActive: false
    };
    
    let setupPlayerCount = 6;
    let historyStack = [];
    let redoStack = [];
    let activeTransferPlayerId = null;

    // SVGs
    const iconTrophy = `<svg class="svg-icon" style="width:16px;height:16px;margin-right:4px;" viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>`;
    const iconSend = `<svg class="svg-icon" style="width:16px;height:16px;margin-right:4px;" viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>`;

    const screens = {
        setup: document.getElementById('setup-screen'),
        game: document.getElementById('game-screen'),
        summary: document.getElementById('summary-screen')
    };

    window.onload = () => {
        renderSetupSeating();
        loadFromStorage();
    };

    function renderSetupSeating() {
        const container = document.getElementById('seating-container');
        container.innerHTML = '';
        for(let i=0; i<setupPlayerCount; i++) {
            container.innerHTML += `
                <div class="seating-row">
                    <input type="text" id="seat-name-${i}" placeholder="Seat ${i+1}" value="Player ${i+1}">
                    <button class="btn-mini" onclick="moveSeatUp(${i})">↑</button>
                    <button class="btn-mini" onclick="moveSeatDown(${i})">↓</button>
                </div>
            `;
        }
    }

    function addSetupPlayer() { setupPlayerCount++; renderSetupSeating(); }
    function removeSetupPlayer() { if(setupPlayerCount > 2) { setupPlayerCount--; renderSetupSeating(); } }

    function moveSeatUp(index) {
        if(index === 0) return;
        swapSeatValues(index, index - 1);
    }
    
    function moveSeatDown(index) {
        if(index === setupPlayerCount - 1) return;
        swapSeatValues(index, index + 1);
    }

    function swapSeatValues(idx1, idx2) {
        const val1 = document.getElementById(`seat-name-${idx1}`).value;
        const val2 = document.getElementById(`seat-name-${idx2}`).value;
        document.getElementById(`seat-name-${idx1}`).value = val2;
        document.getElementById(`seat-name-${idx2}`).value = val1;
    }

    function populateSetupScreen() {
        document.getElementById('start-coins').value = state.startingCoins;
        document.getElementById('boot-amount').value = state.bootAmount;
        document.getElementById('max-pot').value = state.maxPotLimit === Infinity ? 0 : state.maxPotLimit;
        
        if (state.players && state.players.length > 0) {
            setupPlayerCount = state.players.length;
            renderSetupSeating();
            state.players.forEach((p, i) => {
                const seatInput = document.getElementById(`seat-name-${i}`);
                if (seatInput) seatInput.value = p.name;
            });
        }
    }

    function loadFromStorage() {
        const saved = localStorage.getItem('3patti_pro');
        if (saved) {
            const data = JSON.parse(saved);
            state.players = data.players || [];
            state.pot = data.pot || 0;
            state.bootAmount = data.bootAmount || 10;
            state.currentBet = data.currentBet || state.bootAmount;
            state.startingCoins = data.startingCoins || 1000;
            state.maxPotLimit = data.maxPotLimit || (state.players.length * state.startingCoins);
            state.currentIdx = data.currentIdx || 0;
            state.gameActive = data.gameActive || false;

            state.players.forEach(p => { p.isSittingOut = p.isSittingOut || false; });
            populateSetupScreen();

            if (state.gameActive) {
                switchScreen('game');
                renderGameUI();
            } else {
                switchScreen('setup');
            }
        }
    }

    function saveToStorage() {
        localStorage.setItem('3patti_pro', JSON.stringify(state));
    }

    function captureSnapshot() {
        historyStack.push(JSON.stringify(state));
        redoStack = []; 
        updateTimeButtons();
    }

    function undo() {
        if (historyStack.length === 0) return;
        redoStack.push(JSON.stringify(state));
        state = JSON.parse(historyStack.pop());
        saveToStorage();
        renderGameUI();
    }

    function redo() {
        if (redoStack.length === 0) return;
        historyStack.push(JSON.stringify(state));
        state = JSON.parse(redoStack.pop());
        saveToStorage();
        renderGameUI();
    }

    function updateTimeButtons() {
        document.getElementById('btn-undo').disabled = historyStack.length === 0;
        document.getElementById('btn-redo').disabled = redoStack.length === 0;
    }

    function switchScreen(target) {
        Object.values(screens).forEach(s => s.style.display = 'none');
        screens[target].style.display = target === 'game' ? 'flex' : 'block';
    }

    function startGame() {
        state.startingCoins = parseInt(document.getElementById('start-coins').value);
        state.bootAmount = parseInt(document.getElementById('boot-amount').value);
        state.maxPotLimit = parseInt(document.getElementById('max-pot').value) || Infinity;
        state.currentBet = state.bootAmount;
        
        state.players = [];
        for(let i=0; i<setupPlayerCount; i++) {
            const nameInput = document.getElementById(`seat-name-${i}`);
            const pName = nameInput && nameInput.value.trim() !== '' ? nameInput.value.trim() : `Player ${i+1}`;
            
            state.players.push({
                id: i+1,
                name: pName,
                balance: state.startingCoins,
                startingBalance: state.startingCoins,
                isFolded: false,
                isSittingOut: false
            });
        }
        
        state.pot = 0;
        state.currentIdx = 0;
        state.gameActive = true;
        historyStack = [];
        redoStack = [];
        
        saveToStorage();
        switchScreen('game');
        renderGameUI();
    }

    function animatePot(targetValue) {
        const el = document.getElementById('pot-display');
        const startValue = parseInt(el.getAttribute('data-value')) || 0;
        if (startValue === targetValue) {
            el.innerText = targetValue.toLocaleString();
            return;
        }
        el.setAttribute('data-value', targetValue);
        
        const duration = 400; 
        const startTime = performance.now();
        
        function update(currentTime) {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const easeProgress = progress * (2 - progress);
            const current = Math.floor(startValue + (targetValue - startValue) * easeProgress);
            el.innerText = current.toLocaleString();
            
            if (progress < 1) requestAnimationFrame(update);
            else el.innerText = targetValue.toLocaleString();
        }
        requestAnimationFrame(update);
    }

    function toggleSitOut(idx) {
        captureSnapshot();
        state.players[idx].isSittingOut = !state.players[idx].isSittingOut;
        if(state.players[idx].isSittingOut) state.players[idx].isFolded = true;
        saveToStorage();
        renderGameUI();
    }

    function collectBoot() {
        captureSnapshot();
        let activeCount = 0;
        
        state.players.forEach(p => {
            if (!p.isSittingOut) {
                p.isFolded = false; 
                p.balance -= state.bootAmount;
                activeCount++;
            }
        });
        
        state.pot += (activeCount * state.bootAmount);
        state.currentBet = state.bootAmount; 
        state.currentIdx = -1;
        advanceTurn(); 
        
        saveToStorage();
        renderGameUI();
    }

    function adjustBet(direction) {
        let newBet = state.currentBet + (direction * state.bootAmount);
        if (newBet < state.bootAmount) newBet = state.bootAmount;
        state.currentBet = newBet;
        saveToStorage();
        renderGameUI();
    }

    function executeBet(playerId, multiplier = 1) {
        const finalAmount = state.currentBet * multiplier;

        if (state.pot + finalAmount > state.maxPotLimit) {
            return Dialog.alert("Pot Limit Reached", `Bet rejected. The max pot limit is ${state.maxPotLimit.toLocaleString()}. Players must show cards!`);
        }

        captureSnapshot();
        const p = state.players.find(p => p.id === playerId);
        p.balance -= finalAmount;
        state.pot += finalAmount;
        
        advanceTurn();
        saveToStorage();
        renderGameUI();
    }

    function foldPlayer(playerId) {
        captureSnapshot();
        const p = state.players.find(p => p.id === playerId);
        p.isFolded = true;
        advanceTurn();
        saveToStorage();
        renderGameUI();
    }

    function awardPot(playerId) {
        if (state.pot === 0) return Dialog.alert("Error", "The central pot is currently empty.");
        const p = state.players.find(p => p.id === playerId);
        
        Dialog.confirm("Award Pot", `Are you sure you want to award ${state.pot.toLocaleString()} coins to ${p.name}?`, "Award Winner", () => {
            captureSnapshot();
            p.balance += state.pot;
            state.pot = 0; 
            state.players.forEach(pl => { if(!pl.isSittingOut) pl.isFolded = false; });
            saveToStorage();
            renderGameUI();
        });
    }

    function advanceTurn() {
        let attempts = 0;
        do {
            state.currentIdx = (state.currentIdx + 1) % state.players.length;
            attempts++;
            if (attempts > state.players.length) break; 
        } while (state.players[state.currentIdx].isFolded || state.players[state.currentIdx].isSittingOut);
    }

    function openTransferModal(playerId) {
        activeTransferPlayerId = playerId;
        const pFrom = state.players.find(x => x.id === playerId);
        document.getElementById('transfer-from').value = pFrom.name;
        
        const toSelect = document.getElementById('transfer-to');
        toSelect.innerHTML = '';
        state.players.forEach(target => {
            if(target.id !== playerId) {
                toSelect.innerHTML += `<option value="${target.id}">${target.name}</option>`;
            }
        });
        
        document.getElementById('transfer-amount').value = '';
        
        const modal = document.getElementById('transfer-modal');
        modal.style.display = 'flex';
        setTimeout(() => modal.classList.add('show'), 10);
    }

    function closeTransferModal() {
        const modal = document.getElementById('transfer-modal');
        modal.classList.remove('show');
        setTimeout(() => modal.style.display = 'none', 200);
    }

    function executeTransfer() {
        const toId = parseInt(document.getElementById('transfer-to').value);
        const amt = parseInt(document.getElementById('transfer-amount').value);
        const type = document.getElementById('transfer-type').value;

        if (isNaN(amt) || amt <= 0) return Dialog.alert("Invalid Amount", "Please enter a valid amount of coins to transfer.");

        captureSnapshot();

        const pFrom = state.players.find(x => x.id === activeTransferPlayerId);
        const pTo = state.players.find(x => x.id === toId);

        pFrom.balance -= amt;
        pTo.balance += amt;

        if (type === 'loan') {
            pFrom.startingBalance -= (amt * 2); 
            pTo.startingBalance += (amt * 2);
        }

        saveToStorage();
        closeTransferModal();
        renderGameUI();
    }

    // --- RENDERING ---
    function renderGameUI() {
        animatePot(state.pot);
        updateTimeButtons();

        const grid = document.getElementById('overview-grid');
        const focus = document.getElementById('focus-panel');
        
        grid.innerHTML = '';
        state.players.forEach((p, index) => {
            let status = '';
            let classes = ['mini-card'];
            if (index === state.currentIdx) classes.push('active');
            if (p.isSittingOut) { classes.push('sitting-out'); status = 'Sitting Out'; }
            else if (p.isFolded) { classes.push('folded'); status = 'Packed'; }

            const balClass = p.balance < 0 ? 'negative' : '';
            if (p.balance < 0) classes.push('negative-bg');
            const badgeHTML = status ? `<div class="status-badge">${status}</div>` : '';

            grid.innerHTML += `
                <div class="${classes.join(' ')}" onclick="state.currentIdx = ${index}; renderGameUI();">
                    <div class="mc-header">
                        <div class="mc-name">${p.name}</div>
                        ${badgeHTML}
                    </div>
                    <div class="mc-bal ${balClass}">${p.balance.toLocaleString()}</div>
                </div>
            `;
        });

        const cp = state.players[state.currentIdx];
        if (!cp) return;

        const isLocked = cp.isFolded || cp.isSittingOut;
        const balClass = cp.balance < 0 ? 'negative' : '';
        const sitOutText = cp.isSittingOut ? 'Join Next Hand' : 'Sit Out Hand';
        const limitWarning = (state.pot >= state.maxPotLimit) ? `<div style="color:var(--danger); font-size:12px; font-weight:bold; text-align:center; margin-bottom:12px;">POT LIMIT REACHED</div>` : '';

        let focusBody = '';

        if (state.pot === 0) {
            focusBody = `
                <div style="text-align:center; padding: 16px; color: var(--text-secondary); background: rgba(0,0,0,0.2); border-radius: var(--radius-md); margin-bottom: 12px; font-size: 14px; font-weight: 600;">
                    Hand has not started.<br>Collect boot to deal cards.
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                    <button class="btn-primary action-btn-large" onclick="collectBoot()">Deal / Boot</button>
                    <button class="btn-outline action-btn-large" onclick="toggleSitOut(${state.currentIdx})">${sitOutText}</button>
                </div>
            `;
        } else {
            focusBody = `
                ${limitWarning}
                ${!isLocked ? `
                    <div class="action-grid" style="margin-bottom: 12px;">
                        
                        <div class="bet-stepper">
                            <button onclick="adjustBet(-1)">-</button>
                            <div class="bet-label">${state.currentBet}</div>
                            <button onclick="adjustBet(1)">+</button>
                        </div>
                        
                        <button class="btn-action action-btn-large" onclick="executeBet(${cp.id}, 1)">Bet 1x</button>
                        <button class="btn-blind action-btn-large" onclick="executeBet(${cp.id}, 2)">Bet 2x</button>
                        
                        <button class="btn-outline action-btn-large" style="grid-column: span 2" onclick="foldPlayer(${cp.id})">Pack (Fold)</button>
                    </div>
                ` : `<div style="text-align:center; padding: 16px; color: var(--text-secondary); background: rgba(0,0,0,0.2); border-radius: var(--radius-md); margin-bottom: 12px; font-size: 14px; font-weight:600;">Player is currently ${cp.isSittingOut ? 'Sitting Out' : 'Packed'}</div>`}

                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                    <button class="btn-primary action-btn-large" style="background:linear-gradient(135deg, var(--warning), #d97706); color:#000;" onclick="awardPot(${cp.id})">${iconTrophy} Take Pot</button>
                    <button class="btn-outline action-btn-large" onclick="toggleSitOut(${state.currentIdx})">${sitOutText}</button>
                </div>
            `;
        }

        focus.innerHTML = `
            <div class="focus-header">
                <div class="focus-name">${cp.name}</div>
                <div class="focus-balance ${balClass}">${cp.balance.toLocaleString()} 🪙</div>
            </div>
            ${focusBody}
            <div style="margin-top: 12px;">
                <button class="btn-outline action-btn-large" style="width:100%; border: 1px dashed rgba(255,255,255,0.2);" onclick="openTransferModal(${cp.id})">${iconSend} Transfer Coins</button>
            </div>
        `;
    }

    function endGame() {
        if (state.pot > 0) {
            return Dialog.alert("Action Required", `There are ${state.pot.toLocaleString()} coins still in the pot. You must award the pot to the winner before ending the game.`);
        }
        
        Dialog.confirm("End Game", "Are you sure you want to end the game and calculate final settlements?", "End Game", () => {
            calculateSettlements();
            switchScreen('summary');
        });
    }

    function calculateSettlements() {
        let debtors = [], creditors = [];
        state.players.forEach(p => {
            const net = p.balance - p.startingBalance;
            if (net < 0) debtors.push({ name: p.name, amount: Math.abs(net) });
            else if (net > 0) creditors.push({ name: p.name, amount: net });
        });

        debtors.sort((a, b) => b.amount - a.amount);
        creditors.sort((a, b) => b.amount - a.amount);

        let html = '', i = 0, j = 0;
        while (i < debtors.length && j < creditors.length) {
            let d = debtors[i], c = creditors[j];
            let amt = Math.min(d.amount, c.amount);
            
            html += `
                <div class="settlement-item">
                    <span><span class="debtor">${d.name}</span> pays <span class="creditor">${c.name}</span></span>
                    <span style="color:var(--warning); font-weight:800;">${amt} 🪙</span>
                </div>
            `;
            d.amount -= amt; c.amount -= amt;
            if (d.amount === 0) i++;
            if (c.amount === 0) j++;
        }
        
        document.getElementById('settlement-list').innerHTML = html || '<div style="text-align:center; font-weight:600;">Everyone broke even!</div>';
    }

    function confirmReset() {
        Dialog.confirm("Reset Table", "Are you sure you want to reset the table? Current balances will be cleared, but your settings will be saved.", "Reset Table", () => {
            state.gameActive = false;
            state.pot = 0; 
            historyStack = [];
            redoStack = [];
            
            saveToStorage();
            populateSetupScreen(); 
            switchScreen('setup');
        });
    }
</script>
